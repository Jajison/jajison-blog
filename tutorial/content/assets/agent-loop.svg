<text x="30" y="43" font-size="29" fill="#1b2537" font-weight="700">Agent：依据反馈决定下一步</text><text x="30" y="78" font-size="18" fill="#526078" font-weight="400">循环需要停止条件；模型宣称完成，不等于真实执行完成。</text>
<rect x="30" y="125" width="380" height="125" rx="18" fill="white" stroke="#dbe1ee"/><rect x="48" y="147" width="5" height="25" rx="2" fill="#315bd6"/><text x="66" y="169" font-size="23" fill="#315bd6" font-weight="700">01 读取目标与状态</text><text x="54" y="204" font-size="18" fill="#526078" font-weight="400">现在要完成什么？</text><rect x="450" y="125" width="380" height="125" rx="18" fill="white" stroke="#dbe1ee"/><rect x="468" y="147" width="5" height="25" rx="2" fill="#315bd6"/><text x="486" y="169" font-size="23" fill="#315bd6" font-weight="700">02 选择下一步</text><text x="474" y="204" font-size="18" fill="#526078" font-weight="400">回答，还是调用工具？</text><rect x="450" y="300" width="380" height="125" rx="18" fill="white" stroke="#dbe1ee"/><rect x="468" y="322" width="5" height="25" rx="2" fill="#137a65"/><text x="486" y="344" font-size="23" fill="#137a65" font-weight="700">03 执行工具</text><text x="474" y="379" font-size="18" fill="#526078" font-weight="400">程序执行并返回真实结果</text><rect x="30" y="300" width="380" height="125" rx="18" fill="white" stroke="#dbe1ee"/><rect x="48" y="322" width="5" height="25" rx="2" fill="#137a65"/><text x="66" y="344" font-size="23" fill="#137a65" font-weight="700">04 观察与更新</text><text x="54" y="379" font-size="18" fill="#526078" font-weight="400">完成就停止，否则依据反馈继续</text><path d="M415 187 L442 187" fill="none" stroke="#7b8ba8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M640 257 L640 291" fill="none" stroke="#7b8ba8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M442 360 L415 360" fill="none" stroke="#7b8ba8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M220 292 L220 258" fill="none" stroke="#7b8ba8" stroke-width="2.5" marker-end="url(#arrow)"/>
