<text x="30" y="43" font-size="29" fill="#1b2537" font-weight="700">从电脑基础到 AI 工程：八条学习路径</text><text x="30" y="78" font-size="18" fill="#526078" font-weight="400">按前置知识逐步阅读，也可以按当前问题选择入口。</text>
<rect x="30" y="112" width="800" height="80" rx="16" fill="white" stroke="#dbe1ee"/><circle cx="72" cy="152" r="24" fill="#e8edfc"/><text x="58" y="159" font-size="20" fill="#315bd6" font-weight="700">01</text><text x="115" y="145" font-size="23" fill="#1b2537" font-weight="700">从零认识电脑与 AI</text><text x="115" y="173" font-size="18" fill="#526078" font-weight="400">操作系统、文件、任务表达与信息安全。</text><rect x="30" y="207" width="800" height="80" rx="16" fill="white" stroke="#dbe1ee"/><circle cx="72" cy="247" r="24" fill="#e8edfc"/><text x="58" y="254" font-size="20" fill="#315bd6" font-weight="700">02</text><text x="115" y="240" font-size="23" fill="#1b2537" font-weight="700">搭好环境，运行代码</text><text x="115" y="268" font-size="18" fill="#526078" font-weight="400">编辑器、终端、Python、依赖与排错。</text><rect x="30" y="302" width="800" height="80" rx="16" fill="white" stroke="#dbe1ee"/><circle cx="72" cy="342" r="24" fill="#e8edfc"/><text x="58" y="349" font-size="20" fill="#315bd6" font-weight="700">03</text><text x="115" y="335" font-size="23" fill="#1b2537" font-weight="700">开发与 GitHub 协作</text><text x="115" y="363" font-size="18" fill="#526078" font-weight="400">网页、HTTP、版本管理、数据与交付。</text><rect x="30" y="397" width="800" height="80" rx="16" fill="white" stroke="#dbe1ee"/><circle cx="72" cy="437" r="24" fill="#e8edfc"/><text x="58" y="444" font-size="20" fill="#315bd6" font-weight="700">04</text><text x="115" y="430" font-size="23" fill="#1b2537" font-weight="700">模型的数学与学习基础</text><text x="115" y="458" font-size="18" fill="#526078" font-weight="400">向量、概率、梯度、神经网络与文本表示。</text><rect x="30" y="492" width="800" height="80" rx="16" fill="white" stroke="#dbe1ee"/><circle cx="72" cy="532" r="24" fill="#e8edfc"/><text x="58" y="539" font-size="20" fill="#315bd6" font-weight="700">05</text><text x="115" y="525" font-size="23" fill="#1b2537" font-weight="700">深入 Transformer 与 LLM</text><text x="115" y="553" font-size="18" fill="#526078" font-weight="400">注意力、位置、训练对齐、推理与多模态。</text><rect x="30" y="587" width="800" height="80" rx="16" fill="white" stroke="#dbe1ee"/><circle cx="72" cy="627" r="24" fill="#e8edfc"/><text x="58" y="634" font-size="20" fill="#315bd6" font-weight="700">06</text><text x="115" y="620" font-size="23" fill="#1b2537" font-weight="700">构建可靠的 RAG</text><text x="115" y="648" font-size="18" fill="#526078" font-weight="400">切分、召回、重排、引用与检索评估。</text><rect x="30" y="682" width="800" height="80" rx="16" fill="white" stroke="#dbe1ee"/><circle cx="72" cy="722" r="24" fill="#e8edfc"/><text x="58" y="729" font-size="20" fill="#315bd6" font-weight="700">07</text><text x="115" y="715" font-size="23" fill="#1b2537" font-weight="700">Agent、工具与运行环境</text><text x="115" y="743" font-size="18" fill="#526078" font-weight="400">控制循环、MCP、权限、记忆与失败恢复。</text><rect x="30" y="777" width="800" height="80" rx="16" fill="white" stroke="#dbe1ee"/><circle cx="72" cy="817" r="24" fill="#e8edfc"/><text x="58" y="824" font-size="20" fill="#315bd6" font-weight="700">08</text><text x="115" y="810" font-size="23" fill="#1b2537" font-weight="700">评估、测试与持续交付</text><text x="115" y="838" font-size="18" fill="#526078" font-weight="400">基线、失败样本、回归测试与上线门槛。</text>
