<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 515" role="img" aria-labelledby="title desc">
<title id="title">注意力：组合相关位置的信息</title><desc id="desc">颜色深浅仅表示示意权重，不是真实模型测量。结构示意，不包含真实注意力数据；权重也不等于完整解释。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7b8ba8"/></marker></defs>
<rect width="860" height="515" rx="24" fill="#f7f8fc"/>
<g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif">
<text x="30" y="43" font-size="29" fill="#1b2537" font-weight="700">注意力：组合相关位置的信息</text><text x="30" y="78" font-size="18" fill="#526078" font-weight="400">颜色深浅仅表示示意权重，不是真实模型测量。</text>
<text x="30" y="131" font-size="21" fill="#1b2537" font-weight="400">处理“签字”附近的信息时，可以组合不同位置的表示。</text><rect x="30" y="168" width="185" height="90" rx="16" fill="#d8e2fc"/><text x="95" y="222" font-size="25" fill="#1b2537" font-weight="700">合同</text><path d="M122 263 L430 327" fill="none" stroke="#7b8ba8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="235" y="168" width="185" height="90" rx="16" fill="#edf1fb"/><text x="300" y="222" font-size="25" fill="#1b2537" font-weight="700">发给</text><path d="M327 263 L430 327" fill="none" stroke="#7b8ba8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="440" y="168" width="185" height="90" rx="16" fill="#c4d3fa"/><text x="505" y="222" font-size="25" fill="#1b2537" font-weight="700">小周</text><path d="M532 263 L430 327" fill="none" stroke="#7b8ba8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="645" y="168" width="185" height="90" rx="16" fill="#9bb4f4"/><text x="710" y="222" font-size="25" fill="#1b2537" font-weight="700">签字</text><path d="M737 263 L430 327" fill="none" stroke="#7b8ba8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="255" y="337" width="350" height="112" rx="18" fill="white" stroke="#dbe1ee"/><rect x="273" y="359" width="5" height="25" rx="2" fill="#137a65"/><text x="291" y="381" font-size="23" fill="#137a65" font-weight="700">组合后的表示</text><text x="279" y="416" font-size="18" fill="#526078" font-weight="400">继续进入后续网络层</text>
<text x="30" y="493" font-size="15" fill="#526078" font-weight="400">结构示意，不包含真实注意力数据；权重也不等于完整解释。</text>
</g></svg>
