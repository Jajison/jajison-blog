<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-labelledby="title desc">
<title id="title">网页发出请求，服务返回结果</title><desc id="desc">API 是程序的调用接口；模型不需要直接拿到密钥。Jajison · 把 AI 用起来 / 原创示意图</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7b8ba8"/></marker></defs>
<rect width="860" height="430" rx="24" fill="#f7f8fc"/>
<g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif">
<text x="30" y="43" font-size="29" fill="#1b2537" font-weight="700">网页发出请求，服务返回结果</text><text x="30" y="78" font-size="18" fill="#526078" font-weight="400">API 是程序的调用接口；模型不需要直接拿到密钥。</text>
<rect x="30" y="155" width="240" height="145" rx="18" fill="white" stroke="#dbe1ee"/><rect x="48" y="177" width="5" height="25" rx="2" fill="#315bd6"/><text x="66" y="199" font-size="23" fill="#315bd6" font-weight="700">浏览器 / 前端</text><text x="54" y="234" font-size="18" fill="#526078" font-weight="400">用户输入问题</text><text x="54" y="263" font-size="18" fill="#526078" font-weight="400">展示返回结果</text><rect x="310" y="155" width="240" height="145" rx="18" fill="white" stroke="#dbe1ee"/><rect x="328" y="177" width="5" height="25" rx="2" fill="#315bd6"/><text x="346" y="199" font-size="23" fill="#315bd6" font-weight="700">后台</text><text x="334" y="234" font-size="18" fill="#526078" font-weight="400">验证请求与权限</text><text x="334" y="263" font-size="18" fill="#526078" font-weight="400">在这里保管密钥</text><rect x="590" y="155" width="240" height="145" rx="18" fill="white" stroke="#dbe1ee"/><rect x="608" y="177" width="5" height="25" rx="2" fill="#137a65"/><text x="626" y="199" font-size="23" fill="#137a65" font-weight="700">外部 API</text><text x="614" y="234" font-size="18" fill="#526078" font-weight="400">接收约定格式</text><text x="614" y="263" font-size="18" fill="#526078" font-weight="400">返回数据或结果</text><path d="M275 228 L303 228" fill="none" stroke="#7b8ba8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M555 228 L583 228" fill="none" stroke="#7b8ba8" stroke-width="2.5" marker-end="url(#arrow)"/><text x="30" y="357" font-size="21" fill="#1b2537" font-weight="400">纯本地待办只需浏览器；需要受保护服务时才增加后台。</text>
<text x="30" y="408" font-size="15" fill="#526078" font-weight="400">Jajison · 把 AI 用起来 / 原创示意图</text>
</g></svg>
