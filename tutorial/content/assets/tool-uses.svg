<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 540" role="img" aria-labelledby="title desc"><title id="title">先从用途认识 AI 工具</title><desc id="desc">同一工具可能具备多种能力；先看你想完成什么。 聊一聊：解释、起草、修改：通用助手：把一段话改到自己满意。查一查：搜索、来源、比较：搜索或研究入口：找到原文，再核对条件。处理文件：整理、统计、生成：文件与办公助手：找到成果，打开再检查。做点东西：小网页、重复任务：项目与开发助手：描述用途，亲手试功能。原创示意图。</desc><rect width="660" height="540" rx="22" fill="#f4f5ed"/><g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="48" fill="#25352a" font-size="29" font-weight="600">先从用途认识 AI 工具</text><text x="30" y="82" fill="#687263" font-size="17">同一工具可能具备多种能力；先看你想完成什么。</text><rect x="30" y="115" width="286" height="165" rx="14" fill="#fffefa" stroke="#daddd0"/><text x="51" y="146" font-size="15" fill="#356653">通用助手</text><text x="51" y="186" font-size="25" font-weight="600" fill="#25352a">聊一聊</text><text x="51" y="221" font-size="19" fill="#424c40">解释、起草、修改</text><text x="51" y="254" font-size="16" fill="#687263">把一段话改到自己满意</text><rect x="344" y="115" width="286" height="165" rx="14" fill="#fffefa" stroke="#daddd0"/><text x="365" y="146" font-size="15" fill="#9a6d3e">搜索或研究入口</text><text x="365" y="186" font-size="25" font-weight="600" fill="#25352a">查一查</text><text x="365" y="221" font-size="19" fill="#424c40">搜索、来源、比较</text><text x="365" y="254" font-size="16" fill="#687263">找到原文，再核对条件</text><rect x="30" y="306" width="286" height="165" rx="14" fill="#fffefa" stroke="#daddd0"/><text x="51" y="337" font-size="15" fill="#356653">文件与办公助手</text><text x="51" y="377" font-size="25" font-weight="600" fill="#25352a">处理文件</text><text x="51" y="412" font-size="19" fill="#424c40">整理、统计、生成</text><text x="51" y="445" font-size="16" fill="#687263">找到成果，打开再检查</text><rect x="344" y="306" width="286" height="165" rx="14" fill="#fffefa" stroke="#daddd0"/><text x="365" y="337" font-size="15" fill="#9a6d3e">项目与开发助手</text><text x="365" y="377" font-size="25" font-weight="600" fill="#25352a">做点东西</text><text x="365" y="412" font-size="19" fill="#424c40">小网页、重复任务</text><text x="365" y="445" font-size="16" fill="#687263">描述用途，亲手试功能</text><text x="30" y="513" fill="#687263" font-size="14">Jajison · 把 AI 用起来 / 原创示意图</text></g></svg>
