<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 475" role="img" aria-labelledby="title desc">
<title id="title">RAG：先找，再答，再核对</title><desc id="desc">资料可以在外部更新，通常不需要改变模型权重。Jajison · 把 AI 用起来 / 原创示意图</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7b8ba8"/></marker></defs>
<rect width="860" height="475" rx="24" fill="#f7f8fc"/>
<g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif">
<text x="30" y="43" font-size="29" fill="#1b2537" font-weight="700">RAG：先找，再答，再核对</text><text x="30" y="78" font-size="18" fill="#526078" font-weight="400">资料可以在外部更新，通常不需要改变模型权重。</text>
<rect x="30" y="130" width="240" height="125" rx="18" fill="white" stroke="#dbe1ee"/><rect x="48" y="152" width="5" height="25" rx="2" fill="#315bd6"/><text x="66" y="174" font-size="23" fill="#315bd6" font-weight="700">提出问题</text><text x="54" y="209" font-size="18" fill="#526078" font-weight="400">活动何时停止报名？</text><rect x="310" y="130" width="240" height="125" rx="18" fill="white" stroke="#dbe1ee"/><rect x="328" y="152" width="5" height="25" rx="2" fill="#315bd6"/><text x="346" y="174" font-size="23" fill="#315bd6" font-weight="700">检索资料</text><text x="334" y="209" font-size="18" fill="#526078" font-weight="400">找到规则与来源行号</text><rect x="590" y="130" width="240" height="125" rx="18" fill="white" stroke="#dbe1ee"/><rect x="608" y="152" width="5" height="25" rx="2" fill="#137a65"/><text x="626" y="174" font-size="23" fill="#137a65" font-weight="700">依据证据回答</text><text x="614" y="209" font-size="18" fill="#526078" font-weight="400">模型组织答案</text><path d="M275 192 L303 192" fill="none" stroke="#7b8ba8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M555 192 L583 192" fill="none" stroke="#7b8ba8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="300" width="800" height="115" rx="18" fill="white" stroke="#dbe1ee"/><rect x="48" y="322" width="5" height="25" rx="2" fill="#137a65"/><text x="66" y="344" font-size="23" fill="#137a65" font-weight="700">最后仍要核对</text><text x="54" y="379" font-size="18" fill="#526078" font-weight="400">找到了候选 ≠ 证据充分；没写明、已过期或相互冲突时不能补造。</text>
<text x="30" y="453" font-size="15" fill="#526078" font-weight="400">Jajison · 把 AI 用起来 / 原创示意图</text>
</g></svg>
