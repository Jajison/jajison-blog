<rect x="30" y="115" width="800" height="110" rx="18" fill="white" stroke="#dbe1ee"/><rect x="48" y="137" width="5" height="25" rx="2" fill="#315bd6"/><text x="66" y="159" font-size="23" fill="#315bd6" font-weight="700">核心运行：模型 ↔ 工具</text><text x="54" y="194" font-size="18" fill="#526078" font-weight="400">Harness 把这段运行过程组织成可观察、可约束、可恢复的任务。</text><rect x="30" y="255" width="385" height="115" rx="18" fill="white" stroke="#dbe1ee"/><rect x="48" y="277" width="5" height="25" rx="2" fill="#137a65"/><text x="66" y="299" font-size="23" fill="#137a65" font-weight="700">目标与输入</text><text x="54" y="334" font-size="18" fill="#526078" font-weight="400">要交付什么，依据什么</text><rect x="445" y="255" width="385" height="115" rx="18" fill="white" stroke="#dbe1ee"/><rect x="463" y="277" width="5" height="25" rx="2" fill="#137a65"/><text x="481" y="299" font-size="23" fill="#137a65" font-weight="700">权限与预算</text><text x="469" y="334" font-size="18" fill="#526078" font-weight="400">能做什么，何时停止</text><rect x="30" y="395" width="385" height="115" rx="18" fill="white" stroke="#dbe1ee"/><rect x="48" y="417" width="5" height="25" rx="2" fill="#137a65"/><text x="66" y="439" font-size="23" fill="#137a65" font-weight="700">状态与记录</text><text x="54" y="474" font-size="18" fill="#526078" font-weight="400">做到哪里，执行过什么</text><rect x="445" y="395" width="385" height="115" rx="18" fill="white" stroke="#dbe1ee"/><rect x="463" y="417" width="5" height="25" rx="2" fill="#137a65"/><text x="481" y="439" font-size="23" fill="#137a65" font-weight="700">恢复与验收</text><text x="469" y="474" font-size="18" fill="#526078" font-weight="400">失败怎么处理，结果怎么查</text>
