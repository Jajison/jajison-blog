<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 540" role="img" aria-labelledby="title desc"><title id="title">一次好用的 AI 对话</title><desc id="desc">不求第一句话完美，先做一版，再一起改。 准备：给相关材料：01：事实、背景和未知项。说明：说希望得到什么：02：用途、读者、结果样子。修改：指出具体问题：03：保留正确部分，只改一项。完成：核对并保存：04：看原文、开文件、试操作。原创示意图。</desc><rect width="660" height="540" rx="22" fill="#f4f5ed"/><g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="48" fill="#25352a" font-size="29" font-weight="600">一次好用的 AI 对话</text><text x="30" y="82" fill="#687263" font-size="17">不求第一句话完美，先做一版，再一起改。</text><rect x="30" y="115" width="286" height="165" rx="14" fill="#fffefa" stroke="#daddd0"/><text x="51" y="146" font-size="15" fill="#356653">01</text><text x="51" y="186" font-size="25" font-weight="600" fill="#25352a">准备</text><text x="51" y="221" font-size="19" fill="#424c40">给相关材料</text><text x="51" y="254" font-size="16" fill="#687263">事实、背景和未知项</text><rect x="344" y="115" width="286" height="165" rx="14" fill="#fffefa" stroke="#daddd0"/><text x="365" y="146" font-size="15" fill="#9a6d3e">02</text><text x="365" y="186" font-size="25" font-weight="600" fill="#25352a">说明</text><text x="365" y="221" font-size="19" fill="#424c40">说希望得到什么</text><text x="365" y="254" font-size="16" fill="#687263">用途、读者、结果样子</text><rect x="30" y="306" width="286" height="165" rx="14" fill="#fffefa" stroke="#daddd0"/><text x="51" y="337" font-size="15" fill="#356653">03</text><text x="51" y="377" font-size="25" font-weight="600" fill="#25352a">修改</text><text x="51" y="412" font-size="19" fill="#424c40">指出具体问题</text><text x="51" y="445" font-size="16" fill="#687263">保留正确部分，只改一项</text><rect x="344" y="306" width="286" height="165" rx="14" fill="#fffefa" stroke="#daddd0"/><text x="365" y="337" font-size="15" fill="#9a6d3e">04</text><text x="365" y="377" font-size="25" font-weight="600" fill="#25352a">完成</text><text x="365" y="412" font-size="19" fill="#424c40">核对并保存</text><text x="365" y="445" font-size="16" fill="#687263">看原文、开文件、试操作</text><text x="30" y="513" fill="#687263" font-size="14">Jajison · 把 AI 用起来 / 原创示意图</text></g></svg>
