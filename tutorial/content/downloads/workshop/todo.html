<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的小清单 · AI 工作台练习</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23315bd6'/%3E%3Cpath d='m10 20 7 7 13-15' fill='none' stroke='white' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#1b2537;background:#f7f8fc;color-scheme:light;--surface:#fff;--line:#dbe1ee;--muted:#526078;--accent:#315bd6}
*{box-sizing:border-box}body{margin:0;padding:48px 20px}main{max-width:740px;margin:auto}header{margin-bottom:32px}.eyebrow{letter-spacing:.12em;font-size:12px;font-weight:700;color:var(--accent)}h1{font-size:36px;letter-spacing:-.03em;margin:12px 0}p{line-height:1.8;color:var(--muted)}.panel{background:var(--surface);border:1px solid var(--line);padding:24px;border-radius:20px}label{display:block;font-weight:600;margin-bottom:10px}.entry{display:flex;gap:10px}input[type=text]{min-width:0;flex:1;border:1px solid var(--line);border-radius:10px;padding:14px;font:inherit;background:var(--surface);color:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;background:var(--accent);color:white;font:inherit;font-weight:600;min-height:46px}button.secondary{background:transparent;border:1px solid var(--line);color:inherit}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:3px solid #86a5ff;outline-offset:3px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 12px}.count{color:var(--muted);font-size:14px}ul{padding:0;list-style:none;margin:0}li{padding:16px 0;border-bottom:1px solid var(--line)}li label{display:flex;gap:14px;align-items:flex-start;margin:0;font-weight:400;cursor:pointer;line-height:1.6}input[type=checkbox]{width:22px;height:22px;flex-shrink:0;accent-color:var(--accent)}li span{overflow-wrap:anywhere}.done span{text-decoration:line-through;color:var(--muted)}.empty{padding:26px 0;text-align:center}.notice{font-size:14px;min-height:26px;margin:16px 0 0}.notice.error{color:#b42318}footer{font-size:13px;color:var(--muted);margin-top:24px;line-height:1.8}
@media(max-width:480px){body{padding:28px 16px}.panel{padding:18px}h1{font-size:30px}.entry{flex-direction:column}.entry button{width:100%}}
@media(prefers-color-scheme:dark){:root{color:#edf2fa;background:#11151d;color-scheme:dark;--surface:#1a2230;--line:#354057;--muted:#b7c3d6;--accent:#9bbaff}button{color:#11151d}.notice.error{color:#ffb4ab}}
</style>
</head>
<body>
<main>
<header><span class="eyebrow">AI 工作台 / 网页练习</span><h1>今天，做成一点事。</h1><p>一个只做三件事的小清单：记下来、标完成、带走结果。</p></header>
<section class="panel" aria-label="我的待办">
<form id="form"><label for="task">下一件要做的事</label><div class="entry"><input id="task" type="text" maxlength="200" autocomplete="off" placeholder="例如：整理本周活动记录"><button type="submit">加入清单</button></div></form>
<div class="toolbar"><span id="count" class="count" aria-live="polite">0 条待办</span><button id="export" class="secondary" type="button">导出 JSON</button></div>
<ul id="tasks"></ul><p id="empty" class="empty">清单还是空的，先写下一件小事。</p>
<p id="notice" class="notice" role="status" aria-live="polite"></p>
</section>
<footer>仅此浏览器保存 · 不联网、不上传内容。清理站点数据、换浏览器或换网址后，记录可能无法找回，请按需导出。此练习没有云同步和导入功能。</footer>
</main>
<script>
'use strict';
const storageKey='ai-workshop-todo-v1';
const form=document.getElementById('form');
const input=document.getElementById('task');
const list=document.getElementById('tasks');
const notice=document.getElementById('notice');
const exportButton=document.getElementById('export');
let tasks=[];
let persistenceBlocked=false;
function message(text,error=false){notice.textContent=text;notice.classList.toggle('error',error)}
try{
 const raw=localStorage.getItem(storageKey);
 if(raw!==null){
  const saved=JSON.parse(raw);
  if(!Array.isArray(saved)||!saved.every(t=>t&&typeof t.id==='string'&&typeof t.text==='string'&&t.text.trim()&&t.text.length<=200&&typeof t.completed==='boolean')||new Set(saved.map(t=>t.id)).size!==saved.length){throw new Error('invalid saved tasks')}
  tasks=saved;
 }
}catch(error){persistenceBlocked=true;message('无法读取已有本地数据，未覆盖原记录。当前新增内容只在本页保留，请导出。',true)}
function save(){
 if(persistenceBlocked){message('本地保存不可用，当前内容只在本页保留，请导出后再关闭。',true);return}
 try{localStorage.setItem(storageKey,JSON.stringify(tasks));message('已保存到此浏览器。')}
 catch(error){persistenceBlocked=true;message('保存失败，当前内容只在本页保留，请导出。',true)}
}
function render(){
 list.replaceChildren();
 for(const task of tasks){
  const item=document.createElement('li');
  item.classList.toggle('done',task.completed);
  const label=document.createElement('label');
  const checkbox=document.createElement('input');
  checkbox.type='checkbox';checkbox.checked=task.completed;
  checkbox.addEventListener('change',()=>{task.completed=checkbox.checked;item.classList.toggle('done',task.completed);save();updateCount()});
  const text=document.createElement('span');text.textContent=task.text;
  label.append(checkbox,text);item.append(label);list.append(item);
 }
 document.getElementById('empty').hidden=tasks.length>0;
 exportButton.disabled=tasks.length===0;
 updateCount();
}
function updateCount(){document.getElementById('count').textContent='共 '+tasks.length+' 条 · 已完成 '+tasks.filter(t=>t.completed).length+' 条'}
form.addEventListener('submit',event=>{
 event.preventDefault();const text=input.value.trim();
 if(!text){message('先写下一件事，空白内容不会加入清单。',true);input.focus();return}
 const id=typeof crypto.randomUUID==='function'?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2);
 tasks.push({id,text,completed:false});input.value='';save();render();input.focus();
});
exportButton.addEventListener('click',()=>{
 const blob=new Blob([JSON.stringify(tasks,null,2)+'\n'],{type:'application/json;charset=utf-8'});
 const url=URL.createObjectURL(blob);const link=document.createElement('a');
 link.href=url;link.download='my-tasks.json';link.hidden=true;document.body.append(link);link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
 if(persistenceBlocked){message('已请求下载当前清单；本地保存仍不可用，请确认下载文件后再关闭。',true)}
 else{message('已请求下载 my-tasks.json，请在浏览器下载列表确认。')}
});
render();
</script>
</body>
</html>
